model:
  feature_dim: 128
  pano_height: 256
  pano_width: 512

input:
  num_frames: 6
  height: 224
  width: 224
  normalization_mean: [0.0, 0.0, 0.0]
  normalization_std: [1.0, 1.0, 1.0]
  fisheye_model: 180_degree_equidistant

training:
  mode: supervised
  batch_size: 1
  lr: 5.0e-5
  epochs: 10
  use_ema: true
  ema_decay: 0.999
  training_data: "data/train"
  val_data: "data/val"
  model_path: "checkpoints"
  model_name: "simple_360.pt"

loss:
  geometry:
    smoothness_weight: 1.0
  supervised:
    l1_weight: 1.0
    ssim_weight: 0.0

inference:
  checkpoint: "checkpoints/simple_360.pt"
  save_outputs: true
  save_intermediate: true
  save_metadata: true
  output_dir: "outputs/panoramas"
  save_format: tiff
