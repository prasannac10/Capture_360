# Project-wide Gradle settings.

# JVM tuning for faster builds
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+ParallelRefProcEnabled

# Parallel & incremental builds
org.gradle.parallel=true
org.gradle.workers.max=2
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# Enable configuration cache (Gradle 8+)
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Enable non-transitive R classes (reduces build size)
android.nonTransitiveRClass=true

# D8 DEX compiler optimization
android.enableD8=true
android.dexOptions.preDexLibraries=false

# Skip lint checks during debug build
android.lintOptions.checkReleaseBuilds=false


# Enable build cache
org.gradle.caching=true

