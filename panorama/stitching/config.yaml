# Capture360 variable-resolution / original-resolution tiled panorama configuration
model:
  feature_dim: 64
  tile_size: 1024
  tile_overlap: 128
  pano_feature_height: 750
  pano_feature_width: 1500
  output_height: 6000
  output_width: 12000
  train_output_height: 1500
  train_output_width: 3000
  encoder:
    backbone: resnet18
    pretrained: true
    feature_stride: 8
  attention:
    heads: 8
    layers: 2
training:
  mode: supervised
  batch_size: 1
  tile_batch_size: 4
  decoder_output_tile: 1024
  lr: 5.0e-5
  weight_decay: 1.0e-4
  epochs: 10
  use_ema: true
  ema_decay: 0.999
  training_data: data/train
  val_data: data/val
  model_path: ../pano_ai/checkpoints
  best_model_name: panorama_tiled_best.pt
  model_name: panorama_tiled_last.pt
  mixed_precision: true
  max_tiles_per_frame: null
input:
  profile: auto
  min_frames: 4
  max_frames: 30
  recommended_fisheye_frames: [4,8]
  recommended_pinhole_frames: [20,30]
  supported_projections: [fisheye_180,pinhole]
  profiles:
    dslr_fisheye: {width: 9504, height: 6336, projection: fisheye_180, fov_degrees: 180.0, min_frames: 4, max_frames: 8}
    drone_still: {width: 4096, height: 3072, projection: pinhole, min_frames: 20, max_frames: 30}
    mobile: {width: 3000, height: 4000, projection: pinhole, min_frames: 20, max_frames: 30}
    mobile_square: {width: 2048, height: 2048, projection: pinhole, min_frames: 4, max_frames: 60}
    mobile_landscape: {width: 1920, height: 1080, projection: pinhole, min_frames: 20, max_frames: 60}
  preserve_original_resolution: true
loss:
  supervised: {l1_weight: 1.0,ssim_weight: 0.2,perceptual_weight: 0.1}
  geometry: {smoothness_weight: 1.0}
stitching:
  # The dispatcher in panorama.stitching calls only this selected implementation.
  # Valid values: ai (trained model) or classical (OpenCV/Hugin).
  engine: ai
  output_width: 12000
  output_height: 6000
correction:
  allow_untrained: false
  checkpoints: {glare: ../pano_ai/checkpoints/glare_best.pt,nadir_zenith: ../pano_ai/checkpoints/nadir_zenith_best.pt,color: ../pano_ai/checkpoints/color_best.pt}
  toggles: {glare: false,dots: false,nadir_zenith: false,color: false,sharpen: false}
inference:
  checkpoint: ../pano_ai/checkpoints/panorama_tiled_best.pt
  output_dir: ../outputs/panoramas
  save_outputs: true
  save_intermediate: true
  save_metadata: true
  save_format: tiff
  tile_batch_size: 4
  output_tile: 1024
advanced_corrections:
  allow_untrained: false
  checkpoints: {parallax: ../pano_ai/checkpoints/parallax_best.pt,ghost_removal: ../pano_ai/checkpoints/ghost_removal_best.pt,seam_blending: ../pano_ai/checkpoints/seam_blending_best.pt,overlap_detection: ../pano_ai/checkpoints/overlap_detection_best.pt,parallax_flow: ../pano_ai/checkpoints/parallax_flow_best.pt}
  # Pairwise AI stages remain disabled until panorama-aligned reference/mask
  # assets and their tiled implementations are available.
  toggles: {parallax: false,ghost_removal: false,seam_blending: false,overlap_detection: false,parallax_flow: false}
classical_methods:
  use_classical_overlap_detection: true
  use_classical_parallax_correction: true
  use_classical_seam_blending: true
  # Ghost removal is only run when the caller provides pre-warped,
  # panorama-aligned frames; native camera frames are never resized as a proxy.
  use_classical_ghost_removal: true
classical_parameters:
  overlap_detection: {feature_detector: orb,min_matches: 4}
  parallax_correction: {depth_estimation_method: stereo_sgbm,interpolation_method: gaussian_blur}
  seam_blending: {blend_type: multiband,seam_sigma: 15.0}
  ghost_removal: {threshold_ratio: 0.3,inpainting_method: poisson}
