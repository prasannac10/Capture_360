# Capture360 variable-resolution / original-resolution tiled panorama configuration
model:
  feature_dim: 64
  tile_size: 1024
  tile_overlap: 128
  pano_feature_height: 750
  pano_feature_width: 1500
  output_height: 6000
  output_width: 12000
  train_output_height: 1500
  train_output_width: 3000
  encoder:
    backbone: resnet18
    pretrained: true
    feature_stride: 8
  attention:
    heads: 8
    layers: 2
training:
  mode: supervised
  batch_size: 1
  tile_batch_size: 4
  decoder_output_tile: 1024
  lr: 5.0e-5
  weight_decay: 1.0e-4
  epochs: 10
  use_ema: true
  ema_decay: 0.999
  training_data: data/train
  val_data: data/val
  model_path: ../pano_ai/checkpoints
  best_model_name: panorama_tiled_best.pt
  model_name: panorama_tiled_last.pt
  mixed_precision: true
  max_tiles_per_frame: null
input:
  # Same calibrated overlap photometry in neural training and inference.
  exposure_compensation:
    enabled: true
    preview_width: 512
    min_overlap: 64
    max_gain: 2.0
    max_log_mad: 0.2
  profile: auto
  min_frames: 4
  max_frames: 30
  recommended_fisheye_frames: [4,8]
  recommended_pinhole_frames: [20,30]
  supported_projections: [fisheye_180,pinhole]
  profiles:
    dslr_fisheye: {width: 9504, height: 6336, projection: fisheye_180, fov_degrees: 180.0, min_frames: 4, max_frames: 8}
    drone_still: {width: 4096, height: 3072, projection: pinhole, min_frames: 20, max_frames: 30}
    mobile: {width: 3000, height: 4000, projection: pinhole, min_frames: 20, max_frames: 30}
    mobile_square: {width: 2048, height: 2048, projection: pinhole, min_frames: 4, max_frames: 60}
    mobile_landscape: {width: 1920, height: 1080, projection: pinhole, min_frames: 20, max_frames: 60}
  preserve_original_resolution: true
loss:
  supervised: {l1_weight: 1.0,ssim_weight: 0.2,perceptual_weight: 0.1}
  # RGB-only training has no predicted geometry for this loss; nonzero is rejected.
  geometry: {smoothness_weight: 0.0}
stitching:
  # The dispatcher in panorama.stitching calls only this selected implementation.
  # ai uses ai_pipeline.mode; classical uses OpenCV/Hugin.
  engine: ai
  output_width: 12000
  output_height: 6000
correction:
  # Train combined on actual initial-stitch / reviewed-final pairs, including defects.
  # Enable it alone after held-out validation; trained weights are not supplied.
  allow_untrained: false
  use_ema: true
  checkpoints: {combined: ../pano_ai/checkpoints/combined_best.pt,glare: ../pano_ai/checkpoints/glare_best.pt,nadir_zenith: ../pano_ai/checkpoints/nadir_zenith_best.pt,color: ../pano_ai/checkpoints/color_best.pt}
  toggles: {combined: false,glare: false,dots: false,nadir_zenith: false,color: false,sharpen: false}
ai_pipeline:
  # Stage 1: trained PanoramaModel stitches source frames into panorama RGB.
  # Stage 2: enabled correction stages process that panorama.
  # Requires a trained panorama checkpoint; source_preserving is an alternative.
  mode: tiled_neural
  learned_views:
    min_confidence: 0.8
    max_displacement: 8.0
    # Enable only after separate supervised training and visual validation.
    alignment: {enabled: false, checkpoint: ../pano_ai/checkpoints/alignment_best.pt}
    blending: {enabled: false, checkpoint: ../pano_ai/checkpoints/blending_best.pt}
inference:
  use_ema: true
  allow_legacy_checkpoint: false
  checkpoint: ../pano_ai/checkpoints/panorama_tiled_best.pt
  output_dir: ../outputs/panoramas
  save_outputs: true
  save_intermediate: true
  save_metadata: true
  save_format: tiff
  tile_batch_size: 4
  output_tile: 1024
advanced_corrections:
  allow_untrained: false
  use_ema: true
  checkpoints: {parallax: ../pano_ai/checkpoints/parallax_best.pt,ghost_removal: ../pano_ai/checkpoints/ghost_removal_best.pt,seam_blending: ../pano_ai/checkpoints/seam_blending_best.pt,overlap_detection: ../pano_ai/checkpoints/overlap_detection_best.pt,parallax_flow: ../pano_ai/checkpoints/parallax_flow_best.pt}
  # AI/legacy advanced stages. These are NOT the classical activation switches.
  # Classical source correction uses classical_pose; finishing (including feet
  # removal) uses classical_finishing below. Keep these false for classical runs.
  toggles: {parallax: false,ghost_removal: false,seam_blending: false,overlap_detection: false,parallax_flow: false}
classical_finishing:
  # Classical-only overrides; learned AI correction settings remain separate.
  object_removal: true
  color: true
  sharpen: true
classical_pose:
  # These run on source frames before final composition, only with ARCore poses.
  # Requires Capture360's guided ring layout in capture-info.json.
  recover_capture_headings: true
  refine_poses: true
  exposure_compensation: true
  seam_blending: true
  # Experimental: scene_0004 trials showed bent edges; keep disabled.
  local_alignment: false
  # Seam canvas and blending depth, independently configurable.
  seam_width: 1024
  blend_bands: 5
classical_scene_overrides:
  # Reviewed per-scene settings; other scenes retain classical_pose defaults.
  scene_0004:
    enabled: true
    seam_width: 1024
    blend_bands: 5
    # Keep the deepest floor in the dedicated downward view instead of mixing
    # displaced tile lines. Upper furniture/ceiling pins remain disabled.
    source_regions:
      - source: nadir
        polygon: [[0.0, 0.92], [1.0, 0.92], [1.0, 1.0], [0.0, 1.0]]
classical_methods:
  # Legacy finishing controls. Source-level ARCore stages use classical_pose above.
  use_classical_overlap_detection: true
  use_classical_parallax_correction: true
  use_classical_seam_blending: true
  # Post-composition geometry/ghost removal is skipped; ownership is chosen
  # on individual source views before blending.
  use_classical_ghost_removal: true
classical_parameters:
  object_removal:
    # Manual normalized regions, selected by the input scene folder name.
    # Unknown scenes are skipped instead of reusing another scene's mask.
    scenes:
      scene_0004:
        max_area_fraction: 0.015
        regions:
          - polygon: [[0.457, 0.788], [0.508, 0.788], [0.510, 0.835], [0.489, 0.885], [0.447, 0.892], [0.439, 0.861]]
            donor_offset: [0.15, 0.0]
          - polygon: [[0.509, 0.790], [0.540, 0.794], [0.561, 0.827], [0.562, 0.857], [0.544, 0.869], [0.518, 0.843]]
            donor_offset: [0.15, 0.0]
      scene_0005:
        max_area_fraction: 0.015
        regions:
          - polygon: [[0.398, 0.778], [0.438, 0.778], [0.452, 0.846], [0.446, 0.882], [0.391, 0.884], [0.386, 0.839]]
            donor_offset: [0.16, 0.0]
          - polygon: [[0.447, 0.776], [0.488, 0.775], [0.518, 0.796], [0.522, 0.846], [0.494, 0.855], [0.447, 0.829]]
            donor_offset: [0.16, 0.0]
  overlap_detection: {feature_detector: orb,min_matches: 4}
  parallax_correction: {depth_estimation_method: stereo_sgbm,interpolation_method: gaussian_blur}
  seam_blending: {blend_type: multiband,seam_sigma: 15.0}
  ghost_removal: {threshold_ratio: 0.3,inpainting_method: poisson}
